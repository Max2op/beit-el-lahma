<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو بيت اللحمة</title>
<meta name="theme-color" content="#0b0707">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0b0707;--card:#161010;--line:#2c2020;--red:#d90f1f;--gold:#ffc414;--text:#f6efe6;--mute:#b9aaa0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}

body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6}
.hero{text-align:center;padding:20px 14px 30px;background:radial-gradient(110% 60% at 50% 0,#3a0b0f 0,var(--bg) 75%)}
.hp{height:230px;width:min(440px,92vw);margin:0 auto;border:3px solid var(--red);border-radius:220px 220px 16px 16px;background:#222 center/cover;box-shadow:0 0 0 5px var(--bg),0 0 0 7px var(--gold)}
.logo{position:relative;width:150px;height:150px;margin:-78px auto 0;border-radius:50%;background:#fff;border:4px solid var(--gold);overflow:hidden;box-shadow:0 0 0 6px var(--bg),0 8px 24px rgba(0,0,0,.6)}
.logo img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.12)}
.hero h1{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:2.1rem;margin:14px 0 0;color:var(--gold);line-height:1.2}
.hero p{margin:2px 0 0;color:var(--mute)}
.nav{position:sticky;top:0;z-index:10;background:#0b0707;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 8px}
.nav ul{display:flex;gap:8px;list-style:none;margin:0;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.nav a{display:block;white-space:nowrap;padding:6px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:.95rem}
.nav a.on{background:var(--red);border-color:var(--red)}
main{max-width:720px;margin:0 auto;padding:8px 14px 120px}
section{margin-top:30px}
.ph{height:120px;margin:10px 0 4px;border-radius:14px;background:#222 center/cover;border:1px solid var(--line)}
h2{font-family:"Lalezar","Cairo",sans-serif;font-weight:400;font-size:1.6rem;margin:0 0 6px;padding:2px 18px 4px;background:var(--red);clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);text-align:center}
.note{color:var(--mute);font-size:.85rem;text-align:center;margin:0 0 4px}
ul.items{list-style:none;margin:0;padding:0}
ul.items{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px}
.items li{display:flex;align-items:baseline;gap:8px;padding:11px 0;border-bottom:1px dashed var(--line)}
.items li:last-child{border-bottom:0}
.items .n{flex:0 1 auto;font-weight:700}
.items .d{flex:1 1 12px;border-bottom:2px dotted #3a2b2b;min-width:12px;transform:translateY(-4px)}
.items .p{flex:none;color:var(--gold);font-weight:800;font-size:1.1rem;display:flex;gap:6px;direction:ltr}
.items .p span+span{color:var(--mute);font-weight:700}
.items .p span+span::before{content:"/ ";color:var(--line)}
.items .p small{font-size:.75rem;font-weight:600;color:var(--mute)}
.contact{margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.contact p{margin:0 0 12px;color:var(--mute)}
.contact b{color:var(--text)}
.bar{position:fixed;inset:auto 0 0 0;display:flex;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(11,7,7,.96);border-top:1px solid var(--line)}
.bar a{flex:1;text-align:center;text-decoration:none;font-weight:800;padding:12px;border-radius:12px;color:#fff}
.bar .c{background:var(--red)}.bar .w{background:#1fa855}
a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.next{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--red);color:#fff;font:800 1rem Cairo,Tahoma,sans-serif;cursor:pointer}
.next:active{transform:scale(.98)}
section{animation:in .22s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){section{animation:none}}
</style>
</head>

}
